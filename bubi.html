<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Ulang Tahun Aji!</title>
    <style>
        /* Desain Minimalis & Pengaturan Dasar */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f7f9fa;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Kontainer Utama Card */
        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 400px;
            width: 100%;
            transition: all 0.4s ease;
        }

        /* Tampilan Awal: Tombol Buka Surat */
        .envelope-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .envelope-icon {
            font-size: 50px;
            color: #4a90e2;
            animation: float 3s ease-in-out infinite;
        }

        .btn-open {
            background-color: #333333;
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: background 0.3s ease;
        }

        .btn-open:hover {
            background-color: #555555;
        }

        /* Tampilan Utama Ucapan (Disembunyikan di awal) */
        .content {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease;
        }

        .content.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        h1 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #222222;
        }

        .highlight {
            color: #4a90e2;
            display: block;
            font-size: 28px;
            margin-top: 5px;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: #666666;
            margin-bottom: 25px;
        }

        .cake-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        /* Animasi Mengapung Halus */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Bagian Awal: Buka Surat -->
        <div class="envelope-wrapper" id="envelopeSection">
            <div class="envelope-icon">✉️</div>
            <button class="btn-open" onclick="bukaSurat()">Buka Surat Ini</button>
        </div>

        <!-- Bagian Isi: Ucapan Selamat Ulang Tahun -->
        <div class="content" id="contentSection">
            <div class="cake-icon">🎂</div>
            <h1>Selamat Ulang Tahun <span class="highlight">Aji Skibudi!</span></h1>
            <p>Hari ini adalah hari yang spesial buat kamu. Semoga di usia yang baru ini, kamu selalu diberikan kesehatan, kebahagiaan, dan semua impian serta cita-citamu bisa segera tercapai. Tetap jadi pribadi yang keren!</p>
            <p style="font-size: 13px; color: #999999; margin-bottom: 0;">Warmest wishes,</p>
            <p style="font-size: 14px; font-weight: 500; margin-top: 5px; color: #4a90e2;">[Nama Kamu]</p>
        </div>
    </div>

    <!-- Elemen Audio untuk Memutar Lagu -->
    <audio id="birthdaySong" src="amba.mp3" preload="auto"></audio>

    <script>
        function bukaSurat() {
            // Sembunyikan tombol buka surat
            const envelope = document.getElementById('envelopeSection');
            envelope.style.display = 'none';

            // Tampilkan isi ucapan dengan animasi
            const content = document.getElementById('contentSection');
            content.classList.add('show');

            // Putar lagu otomatis
            const song = document.getElementById('birthdaySong');
            song.play().catch(function(error) {
                console.log("Pemutaran musik diblokir oleh browser:", error);
            });
        }
    </script>

</body>
</html>
